<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="منصة تعليمية متكاملة تتيح للمدرسين رفع فيديوهاتهم وللطلاب الوصول لمحتوى تعليمي متميز" />
    <meta name="theme-color" content="#3b82f6" />
    <title>منصة العلم</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="dns-prefetch" href="https://*.supabase.co" />
    <meta name="robots" content="index, follow" />
  </head>
  <body>
    <div id="root">
      <div id="app-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0f172a;z-index:9999;">
        <div style="width:44px;height:44px;border:4px solid #1e3a5f;border-top-color:#2563eb;border-radius:50%;animation:nab-spin 0.8s linear infinite;"></div>
        <div style="color:#e2e8f0;font-size:16px;font-weight:700;font-family:system-ui,-apple-system,sans-serif;">منصة العلم</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
